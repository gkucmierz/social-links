server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never serve 200 index.html for missing static asset extensions (Cloudflare/NPM cache guard)
    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|otf|json|map)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
