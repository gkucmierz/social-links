name: social-links

services:
  social-links:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-links
    restart: unless-stopped    expose:
      - "80"
    networks:
      npm_public:
        aliases:
          - social-links
          - links
          - social

networks:
  npm_public:
    external: true
    name: npm_public
